# PROTOTYPE: monthly 160h contract where PAID LEAVE counts but WEEKLY REST does not.
#
# Three kinds of day, and how each counts toward the 160h/month:
#   1. Worked shift (LD/AM/PM) -> counts its real length
#   2. Paid leave (LV)         -> counts 8h  (it is paid)
#   3. Weekly rest day (OFF)   -> counts 0h  (>= 2 per week, unpaid rest)
#
# Mechanism (no engine change): the "shift count" preference sums
# coefficient * (assignment booleans). Coefficients are shift length in
# HALF-HOURS so 12.5h stays integer. Paid leave LV is a real shift type with
# coefficient 16 (=8h) and is INCLUDED in the count. Ordinary rest OFF is
# simply left OUT of the count, so it contributes nothing. 160h = 320 units.
#
#   Shift type   Time         Hours   Coefficient   In 160h sum?
#   LD           0800-2030    12.5    25            yes
#   AM1          0800-1500    7.0     14            yes
#   AM2          0800-1600    8.0     16            yes
#   AM3          0800-1700    9.0     18            yes
#   PM1          1200-2100    9.0     18            yes
#   PM2          1300-2100    8.0     16            yes
#   PM3          1400-2100    7.0     14            yes
#   LV           paid leave   8.0     16            yes  <-- leave counts
#   OFF          weekly rest  0.0     -             NO   <-- rest does not count
apiVersion: alpha
description: 160h contract, paid leave counts, weekly rest does not (Feb 2026)
dates:
  range:
    startDate: 2026-02-01
    endDate: 2026-02-28
people:
  items:
    - id: 0
      description: Nurse 0 (takes 2 paid-leave days on Feb 10-11)
    - id: 1
      description: Nurse 1
    - id: 2
      description: Nurse 2
    - id: 3
      description: Nurse 3
    - id: 4
      description: Nurse 4
shiftTypes:
  items:
    - id: LD
      description: Long day 0800-2030 (12.5h)
    - id: AM1
      description: AM 0800-1500 (7h)
    - id: AM2
      description: AM 0800-1600 (8h)
    - id: AM3
      description: AM 0800-1700 (9h)
    - id: PM1
      description: PM 1200-2100 (9h)
    - id: PM2
      description: PM 1300-2100 (8h)
    - id: PM3
      description: PM 1400-2100 (7h)
    - id: LV
      description: Paid leave (counts as 8h)
  groups:
    - id: AM
      description: Any morning variant
      members: [AM1, AM2, AM3]
    - id: PM
      description: Any afternoon/evening variant
      members: [PM1, PM2, PM3]
preferences:
  - type: at most one shift per day

  # --- Coverage: 1 long day + 1 AM + 1 PM staffed every date. LV and OFF give no coverage. ---
  - type: shift type requirement
    description: One nurse on the long day every date
    shiftType: LD
    requiredNumPeople: 1
  - type: shift type requirement
    description: One nurse on any AM variant every date
    shiftType: AM
    requiredNumPeople: 1
  - type: shift type requirement
    description: One nurse on any PM variant every date
    shiftType: PM
    requiredNumPeople: 1

  # --- Paid leave is an INPUT, not solver's choice. Pin it exactly. ---
  # Nurse 0 requests 2 paid-leave days (hard).
  - type: shift request
    description: Nurse 0 paid leave Feb 10
    person: 0
    date: 10
    shiftType: LV
    weight: .inf
  - type: shift request
    description: Nurse 0 paid leave Feb 11
    person: 0
    date: 11
    shiftType: LV
    weight: .inf
  # Nobody else is on leave: pin total LV = 0 for the rest (prevents the solver
  # from inventing leave to game the hour total).
  - type: shift count
    description: No unplanned leave for nurses 1-4
    person: [1, 2, 3, 4]
    countDates: ALL
    countShiftTypes: LV
    expression: 'x = T'
    target: 0
    weight: .inf

  # --- At least 2 weekly rest days (OFF) per nurse, per week ---
  - type: shift count
    description: >-
      At least 2 rest days each week (one preference per week; OFF only,
      so these days carry no hours)
    person: ALL
    countDates: 2026-02-01~2026-02-07
    countShiftTypes: OFF
    expression: 'x >= T'
    target: 2
    weight: .inf
  - type: shift count
    description: Week 2 >= 2 rest days
    person: ALL
    countDates: 2026-02-08~2026-02-14
    countShiftTypes: OFF
    expression: 'x >= T'
    target: 2
    weight: .inf
  - type: shift count
    description: Week 3 >= 2 rest days
    person: ALL
    countDates: 2026-02-15~2026-02-21
    countShiftTypes: OFF
    expression: 'x >= T'
    target: 2
    weight: .inf
  - type: shift count
    description: Week 4 >= 2 rest days
    person: ALL
    countDates: 2026-02-22~2026-02-28
    countShiftTypes: OFF
    expression: 'x >= T'
    target: 2
    weight: .inf

  # --- HARD monthly contract: worked hours + paid-leave credits = EXACTLY 160h ---
  # 160h = 320 half-hour units. LV is included (counts 8h); OFF is NOT listed (counts 0).
  - type: shift count
    description: Worked hours + paid leave must equal exactly 160h this month
    person: ALL
    countDates: ALL
    countShiftTypes: [LD, AM1, AM2, AM3, PM1, PM2, PM3, LV]
    countShiftTypeCoefficients:
      - [LD, 25]
      - [AM1, 14]
      - [AM2, 16]
      - [AM3, 18]
      - [PM1, 18]
      - [PM2, 16]
      - [PM3, 14]
      - [LV, 16]           # paid leave day counts as 8h
    expression: 'x = T'
    target: 320
    weight: .inf
